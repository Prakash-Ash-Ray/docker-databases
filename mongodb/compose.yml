services:
  mongodb:
    image: mongo:8
    # restart: unless-stopped

    environment:
      # Required for MongoDB on kernels affected by the rseq incompatibility.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - dev-network

    cpus: 2
    mem_limit: 2g

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

    security_opt:
      - "no-new-privileges:true"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:

networks:
  dev-network:
    name: dev-network
    external: true
